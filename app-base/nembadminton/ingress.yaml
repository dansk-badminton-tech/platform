apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nembadminton
  namespace: nembadminton
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: staging-nembadminton-dk
  hostnames:
    - staging.nembadminton.dk
  rules:
    - backendRefs:
        - name: nembadminton-web
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nembadminton-web
  namespace: nembadminton
spec:
  selector:
    app: nembadminton
  ports:
  - port: 80
    targetPort: 80
