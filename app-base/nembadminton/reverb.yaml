apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nembadminton-reverb
  name: nembadminton-reverb
  namespace: nembadminton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nembadminton-reverb
  template:
    metadata:
      labels:
        app: nembadminton-reverb
    spec:
      containers:
      - image: ghcr.io/dansk-badminton-tech/nembadminton:v1.34.8 # {"$imagepolicy": "nembadminton:nembadminton"}
        name: nembadminton-reverb
        args: ["php", "artisan", "reverb:start"]
        envFrom:
        - configMapRef:
            name: nembadminton-config
        - secretRef:
            name: nembadminton
        resources:
          requests:
            memory: "256Mi"
          limits:
            memory: "2Gi"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nembadminton-reverb
  namespace: nembadminton
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: ws-platform-nembadminton-dk
  hostnames:
    - ws.platform.nembadminton.dk
  rules:
    - backendRefs:
        - name: nembadminton-reverb
          port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nembadminton-reverb
  namespace: nembadminton
spec:
  selector:
    app: nembadminton-reverb
  ports:
  - port: 8080
    targetPort: 8080
